<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Expense Pocket</title>
<meta name="description" content="Privacy policy, terms of use and account deletion for the Expense Pocket app.">
<style>
:root{--bg:#ffffff;--tile:#f5f7fa;--border:#dde2ea;--text:#14181f;--muted:#566172;--accent:#08748f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tile:#1a1e25;--border:#272d37;--text:#e9eef5;--muted:#98a3b3;--accent:#4de1ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.75rem;line-height:1.25;margin:1rem 0 .25rem}
h2{font-size:1.2rem;margin:2rem 0 .5rem;padding-top:.5rem;border-top:1px solid var(--border)}
p,li{margin:.5rem 0}
ul{padding-left:1.25rem}
a{color:var(--accent)}
.meta{color:var(--muted);margin:0 0 1rem}
.note{background:var(--tile);border:1px solid var(--border);border-radius:1rem;padding:.75rem 1rem}
nav a{display:inline-block;min-height:2.75rem;line-height:2.75rem;margin-right:1rem}
a.tile{display:block;min-height:3rem;background:var(--tile);border:1px solid var(--border);border-radius:1.25rem;padding:1rem;margin:.75rem 0;color:var(--text);text-decoration:none}
a.tile strong{display:block;color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Expense Pocket</h1>
<p class="meta">A personal finance app for Android.</p>
<a class="tile" href="privacy"><strong>Privacy Policy</strong>What data the app handles and why.</a>
<a class="tile" href="terms"><strong>Terms of use</strong>The terms for using the app, including Premium and Lifetime.</a>
<a class="tile" href="delete-account"><strong>Delete your account</strong>How to delete your account and data.</a>
</main>
</body>
</html>
